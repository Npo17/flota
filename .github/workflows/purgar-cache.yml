# Cuando GitHub Pages termina de publicar una versión nueva, vacía la caché de Cloudflare
# para que nadie reciba archivos viejos. Necesita el secreto CLOUDFLARE_API_TOKEN en el repo.
name: Vaciar caché de Cloudflare

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

jobs:
  purgar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Vaciar la caché de ageofnavies.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; fi
          sleep 10
          API=https://api.cloudflare.com/client/v4
          ZONA=0aaff31faf8f2473e604daec2bb8689e  # identificador de ageofnavies.com en Cloudflare (no es una clave)
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "$API/zones/$ZONA/purge_cache" -d '{"purge_everything":true}' > respuesta.json
          jq -c '{success, errors}' respuesta.json
          jq -e '.success' respuesta.json > /dev/null
          echo "Caché vaciada"
